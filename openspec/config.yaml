schema: spec-driven

context: |
  chezmoi.nvim: Neovim plugin integrating the chezmoi dotfile manager.
  Greenfield; a prior single-file prototype exists only as a reference for behaviour.
  Target: Neovim >= 0.12, chezmoi >= 2.70. Pure Lua, no runtime plugin dependencies.
  Layout: lua/chezmoi/*.lua, plugin/chezmoi.lua, doc/chezmoi.txt.
  All chezmoi invocations are async via vim.system; the UI never blocks.
  User-facing notifications go through vim.notify.
  Tests: mini.test in headless nvim with an isolated HOME and a throwaway chezmoi
  source dir; never touch the real user config.
  Entry points: Makefile targets (make test, make lint: stylua + lua-language-server).
  Code, comments, commits and docs in English.

